<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azor - Getearia</title>
<meta name="description" content="GTA 6 em português: segredos, carros raros e dicas testadas no jogo. Vídeos no YouTube e no TikTok.">
<meta property="og:title" content="Azor - Getearia">
<meta property="og:description" content="GTA 6 em português: segredos, carros raros e dicas testadas no jogo.">
<meta property="og:image" content="https://getearia.github.io/img/avatar-512.jpg">
<meta name="theme-color" content="#120c20">
<link rel="icon" href="img/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #120c20; --cartao: #1B122E; --cartao2: #241838; --rosa: #FF5BC8; --pessego: #FFB67A; --borda: #FF7AD0;
    --texto: #f6f0fd; --apagado: #b9a8d4; --verde: #19C7B8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); font-family: "Montserrat", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .pagina { max-width: 480px; margin: 0 auto; padding-bottom: 28px; }

  /* topo */
  /* topo compacto (23/11): o vídeo novo tem que aparecer na primeira tela do celular */
  .topo { position: relative; height: 108px; background: #2a1440 url("img/fundo.jpg") center 45% / cover no-repeat; }
  .topo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,12,32,0) 30%, var(--fundo) 100%); }
  .perfil { position: relative; margin-top: -50px; text-align: center; padding: 0 16px; z-index: 1; }
  .avatar { width: 86px; height: 86px; border-radius: 50%; display: block; margin: 0 auto 8px; border: 3px solid var(--fundo);
            box-shadow: 0 0 0 3px var(--borda), 0 0 22px rgba(255, 91, 200, .55); background: var(--cartao); object-fit: cover; }
  h1 { margin: 0; font-weight: 900; font-size: 23px; letter-spacing: .5px; text-transform: uppercase;
       background: linear-gradient(90deg, var(--rosa), var(--pessego)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .arroba { margin: 0 0 5px; color: var(--apagado); font-weight: 600; font-size: 13px; }
  .frase { margin: 0 auto; max-width: 330px; font-size: 13px; line-height: 1.4; color: var(--texto); font-weight: 600; }

  /* botões das redes: os três lado a lado */
  .redes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px 2px; }
  .rede { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; border-radius: 14px; background: var(--cartao);
          border: 2px solid var(--borda); box-shadow: 0 0 18px rgba(255, 91, 200, .18); transition: transform .12s ease; text-align: center; }
  .rede:active { transform: scale(.97); }
  .rede .icone { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .rede .icone svg { width: 20px; height: 20px; }
  .rede.yt .icone { background: #ff0033; }
  .rede.tt .icone { background: #000; box-shadow: inset 0 0 0 1px #333; }
  .rede.ig .icone { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .rede b { display: block; font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }

  /* seções */
  h2 { margin: 18px 16px 10px; font-size: 13px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; color: var(--pessego);
       display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(255,122,208,.6), rgba(255,122,208,0)); }
  .escondido { display: none !important; }

  /* destaques fixados */
  .destaques { display: grid; gap: 10px; padding: 0 16px; }
  .destaque { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: linear-gradient(90deg, var(--rosa), var(--pessego)); color: #1B122E; }
  .destaque .mini { width: 92px; aspect-ratio: 16 / 9; border-radius: 9px; flex: none; background: #000 center / cover no-repeat; }
  .destaque .mini.vazia { display: none; }
  .destaque b { font-weight: 900; font-size: 14.5px; line-height: 1.25; }
  .destaque small { display: block; font-weight: 800; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; opacity: .75; margin-bottom: 2px; }

  /* vídeo novo */
  .novo { display: block; margin: 0 16px; border-radius: 16px; overflow: hidden; background: var(--cartao); border: 2px solid var(--borda); }
  .novo .capa { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; }
  .play { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
          background: rgba(18, 12, 32, .72); border: 2px solid #fff; display: grid; place-items: center; }
  .play::before { content: ""; margin-left: 5px; border-style: solid; border-width: 11px 0 11px 18px; border-color: transparent transparent transparent #fff; }
  .novo .info { padding: 12px 14px 14px; }
  .selo { display: inline-block; font-size: 10.5px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-radius: 6px;
          background: linear-gradient(90deg, var(--rosa), var(--pessego)); color: #1B122E; margin-bottom: 7px; }
  .novo b { display: block; font-weight: 800; font-size: 16px; line-height: 1.3; }

  /* vídeos longos (os Shorts ficam de fora: o dono quer só os longos aqui, 23/11) */
  .lista { display: grid; gap: 10px; padding: 0 16px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; background: var(--cartao); }
  .item .capa { width: 138px; flex: none; aspect-ratio: 16 / 9; border-radius: 9px; background: #000 center / cover no-repeat; }
  .item b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 1.3; font-weight: 700; }

  .rodape { margin: 30px 16px 0; text-align: center; font-size: 12px; color: var(--apagado); font-weight: 600; }
  .rodape a { color: var(--pessego); }
</style>
</head>
<body>
<div class="pagina">
  <div class="topo" role="img" aria-label="Pôr do sol na praia"></div>
  <div class="perfil">
    <img class="avatar" src="img/avatar.jpg" alt="Azor, o vampiro de óculos" width="86" height="86">
    <h1>Azor - Getearia</h1>
    <p class="arroba">@getearia</p>
    <p class="frase">GTA 6 em português: segredos, carros raros e dicas testadas no jogo.</p>
  </div>

  <nav class="redes">
    <a class="rede yt" id="link-yt" href="https://www.youtube.com/@getearia">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M9.5 7.6v8.8l7.3-4.4z"/></svg></span>
      <b>YouTube</b>
    </a>
    <a class="rede tt" id="link-tt" href="https://www.tiktok.com/@getearia">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#25F4EE" d="M15.9 3.2c.4 2.2 1.8 3.6 4 3.8v2.8c-1.4 0-2.8-.4-4-1.2v6.1c0 3.2-2.5 5.6-5.6 5.6S4.7 17.9 4.7 14.8s2.6-5.6 5.8-5.5v2.9c-1.5-.2-2.9 1-2.9 2.6 0 1.5 1.2 2.7 2.7 2.7s2.7-1.2 2.7-2.8V3.2z" transform="translate(-.8 -.4)"/><path fill="#FE2C55" d="M15.9 3.2c.4 2.2 1.8 3.6 4 3.8v2.8c-1.4 0-2.8-.4-4-1.2v6.1c0 3.2-2.5 5.6-5.6 5.6S4.7 17.9 4.7 14.8s2.6-5.6 5.8-5.5v2.9c-1.5-.2-2.9 1-2.9 2.6 0 1.5 1.2 2.7 2.7 2.7s2.7-1.2 2.7-2.8V3.2z" transform="translate(.8 .4)"/><path fill="#fff" d="M15.9 3.2c.4 2.2 1.8 3.6 4 3.8v2.8c-1.4 0-2.8-.4-4-1.2v6.1c0 3.2-2.5 5.6-5.6 5.6S4.7 17.9 4.7 14.8s2.6-5.6 5.8-5.5v2.9c-1.5-.2-2.9 1-2.9 2.6 0 1.5 1.2 2.7 2.7 2.7s2.7-1.2 2.7-2.8V3.2z"/></svg></span>
      <b>TikTok</b>
    </a>
    <a class="rede ig" id="link-ig" href="https://www.instagram.com/getearia">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="#fff"/></svg></span>
      <b>Instagram</b>
    </a>
  </nav>

  <section id="sec-destaques" class="escondido">
    <h2>Em destaque</h2>
    <div class="destaques" id="destaques"></div>
  </section>

  <section id="sec-novo" class="escondido">
    <h2>Vídeo novo</h2>
    <a class="novo" id="novo" href="#"><div class="capa"><span class="play"></span></div><div class="info"><span class="selo">No YouTube</span><b></b></div></a>
  </section>

  <section id="sec-videos" class="escondido">
    <h2>Mais vídeos</h2>
    <div class="lista" id="videos"></div>
  </section>

  <p class="rodape">@getearia no YouTube, no TikTok e no Instagram</p>
</div>

<script>
// Os vídeos vêm do videos.json (o GitHub atualiza sozinho a partir do feed do canal) e os destaques do links.json
// (fixados à mão com o adicionar.py).
// Links do YouTube (25/11): abrem direto no toque, sem página no meio que redireciona sozinha (regra de spam da Meta).
//   Android: intent:// com o pacote do YouTube (abre o app; sem app, o site). Computador: youtube.com.
//   iPhone: a página getearia.github.io/yt, que mostra o botão "Abrir no YouTube" (o youtube:// sem app não faz nada,
//   então o iPhone precisa do botão "Abrir no navegador" de reserva que essa página tem).
(function () {
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var iphone = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && /mobile/i.test(ua));
  var APP = 'https://getearia.github.io/yt/';
  var TT = 'https://www.tiktok.com/@getearia';
  // busca = '?v=ID' (vídeo), '?s=ID' (Short) ou '?c=@canal'
  function youtube(busca) {
    var q = new URLSearchParams(busca), caminho;
    if (q.get('v')) caminho = 'watch?v=' + q.get('v');
    else if (q.get('s')) caminho = 'shorts/' + q.get('s');
    else caminho = '@' + (q.get('c') || 'getearia').replace(/^@/, '');
    var web = 'https://www.youtube.com/' + caminho;
    if (android) return 'intent://www.youtube.com/' + caminho + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' +
      encodeURIComponent(web) + ';end';
    if (iphone) return APP + busca;
    return web;
  }
  document.getElementById('link-yt').href = youtube('?c=@getearia');
  if (android) {
    document.getElementById('link-tt').href = 'intent://www.tiktok.com/@getearia#Intent;scheme=https;package=com.zhiliaoapp.musically;S.browser_fallback_url=' +
      encodeURIComponent(TT) + ';end';
    document.getElementById('link-ig').href = 'intent://instagram.com/_u/getearia#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=' +
      encodeURIComponent('https://www.instagram.com/getearia') + ';end';
  }

  function el(tag, cls, filhos) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    (filhos || []).forEach(function (f) { e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f); });
    return e;
  }
  // Capa própria de um vídeo (a mesma do link do story, em yt/capas/ID.jpg), quando o dono quer outra imagem em vez da do YouTube.
  var CAPAS = { 'kYG847rBwI4': '/yt/capas/kYG847rBwI4.jpg', // 26/11: GTA 6 no PC, a CONSOLE × PC
                'frsuds9fF1g': '/yt/capas/frsuds9fF1g.jpg' }; // 28/11: $1.000.000 em 10 minutos, a van do dinheiro
  function capa(id) { return 'url("' + (CAPAS[id] || 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg') + '")'; }
  function linkApp(v) { return youtube((v.tipo === 'short' ? '?s=' : '?v=') + v.id); }
  function limpo(t) { return String(t || '').replace(/^GTA 6:\s*/i, ''); }
  function json(nome) {
    return fetch(nome + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  json('links.json').then(function (d) {
    var lista = (d && d.destaques) || [];
    if (!lista.length) return;
    var caixa = document.getElementById('destaques');
    lista.forEach(function (x) {
      var mini = el('span', 'mini' + (x.imagem ? '' : ' vazia'));
      if (x.imagem) mini.style.backgroundImage = 'url("' + x.imagem + '")';
      var texto = el('span', '', [el('small', '', [x.etiqueta || 'Assista']), el('b', '', [x.titulo || x.url])]);
      var a = el('a', 'destaque', [mini, texto]);
      // destaque do YouTube fixado pelo adicionar.py vem como getearia.github.io/yt/?v=ID: abre direto, igual aos vídeos
      a.href = x.url.indexOf(APP) === 0 ? youtube(x.url.slice(APP.length)) : x.url;
      caixa.appendChild(a);
    });
    document.getElementById('sec-destaques').classList.remove('escondido');
  });

  json('videos.json').then(function (d) {
    var vs = (d && d.videos) || [];
    var longos = vs.filter(function (v) { return v.tipo === 'video'; });
    if (longos.length) {
      var n = longos[0], a = document.getElementById('novo');
      a.href = linkApp(n);
      a.querySelector('.capa').style.backgroundImage = capa(n.id);
      a.querySelector('b').textContent = limpo(n.titulo);
      document.getElementById('sec-novo').classList.remove('escondido');
    }
    if (longos.length > 1) {
      var cl = document.getElementById('videos');
      longos.slice(1, 9).forEach(function (v) {
        var c = el('span', 'capa'); c.style.backgroundImage = capa(v.id);
        var a = el('a', 'item', [c, el('b', '', [limpo(v.titulo)])]); a.href = linkApp(v);
        cl.appendChild(a);
      });
      document.getElementById('sec-videos').classList.remove('escondido');
    }
  });
})();
</script>
</body>
</html>
