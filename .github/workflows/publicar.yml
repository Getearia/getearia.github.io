name: Publicar a página da bio

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.guardar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: Pegar os vídeos novos do canal
        run: python3 atualizar.py

      - name: Guardar os vídeos no repositório
        id: guardar
        run: |
          if git diff --quiet -- videos.json; then
            mudou=false
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Vídeos novos do canal"
            git push
            mudou=true
          fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$mudou" = "true" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar a página
        if: steps.guardar.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: montar
    if: needs.montar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
